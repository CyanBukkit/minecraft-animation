name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'CyanBukkit/minecraft-animation' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release tag and package metadata
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run skill:check
      - run: npm test
      - run: npm run build
      - run: npm run test:web
      - run: npm run test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: artifacts/release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.13.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: artifacts/release
      - name: Publish the tested tarball via OIDC
        shell: bash
        run: |
          packages=(artifacts/release/*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public --provenance --ignore-scripts
